<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - قيد التطوير</title>
    <!-- استيراد خط عربي جميل (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: #161b22;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            max-width: 450px;
            width: 90%;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #5865F2; /* لون ديسكورد المميز */
            letter-spacing: 1px;
        }

        p {
            color: #8b949e;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
        }

        /* زر إدخال البوت */
        .btn-bot {
            background-color: #5865F2;
            color: #ffffff;
        }

        .btn-bot:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        /* زر الدعم الفني */
        .btn-support {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-support:hover {
            background-color: #30363d;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>الـداشـبـورد قـيـد الـتـطـويـر</h1>
        <p>نحن نعمل بجهد لإحضار لوحة تحكم مذهلة لبوتك قريباً. ترقبوا التحديثات!</p>
        
        <div class="buttons">
            <!-- ضع رابط دعوة البوت الخاص بك مكان علامة # -->
            <a href="#" target="_blank" class="btn btn-bot">إدخال البوت</a>
            
            <!-- ضع رابط سيرفر الدعم الفني الخاص بك مكان علامة # -->
            <a href="#" target="_blank" class="btn btn-support">الدعم الفني</a>
        </div>
    </div>

</body>
</html>
